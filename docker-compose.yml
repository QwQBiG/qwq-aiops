services:
  qwq:
    # 本地构建（推荐）
    build: .
    image: qwq-aiops:latest
    # 或者使用 GitHub Container Registry 镜像（需要先发布）
    # image: ghcr.io/qwqbig/qwq-aiops:latest
    container_name: qwq
    restart: unless-stopped
    ports:
      - "127.0.0.1:8081:8080"
    volumes:
      # Docker socket（用于容器管理）
      # Access depends on the host socket permissions, even with a read-only mount.
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # 数据持久化
      - ./data:/app/data
      - ./logs:/app/logs
      - ./backups:/app/backups
    environment:
      # 基础配置
      - TZ=Asia/Shanghai
      - PORT=8080
      # Model endpoint configuration is loaded from .env by Compose.
      - AI_PROVIDER=${AI_PROVIDER:-openai}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-https://api.openai.com/v1}
      - OPENAI_MODEL=${OPENAI_MODEL:-}
      - OLLAMA_HOST=${OLLAMA_HOST:-http://host.docker.internal:11434}
      - OLLAMA_MODEL=${OLLAMA_MODEL:-}
      
      # Recreate the service with docker compose up -d qwq after changing .env.
      
      # 通知配置（从 .env 文件读取）
      - DINGTALK_WEBHOOK=${DINGTALK_WEBHOOK:-}
      
      # Web 认证配置
      - WEB_USER=${WEB_USER:?Set WEB_USER in .env}
      - WEB_PASSWORD=${WEB_PASSWORD:?Set WEB_PASSWORD in .env}
    networks:
      - qwq-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    # 资源限制
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M

  # Optional infrastructure; the current web handlers do not connect to it.
  mysql:
    profiles: [database]
    image: mysql:8.0
    container_name: qwq-mysql
    restart: unless-stopped
    ports:
      - "127.0.0.1:3308:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD:-}
      - MYSQL_DATABASE=qwq
      - MYSQL_USER=qwq
      - MYSQL_PASSWORD=${MYSQL_PASSWORD:-}
      - TZ=Asia/Shanghai
    volumes:
      - mysql-data:/var/lib/mysql
      - ./config/mysql.cnf:/etc/mysql/conf.d/custom.cnf:ro
    command: 
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-authentication-plugin=mysql_native_password
    networks:
      - qwq-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G

  # Redis 缓存（可选）
  redis:
    profiles: [cache]
    image: redis:7-alpine
    container_name: qwq-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6380:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    networks:
      - qwq-network

  # Prometheus 监控（可选）
  prometheus:
    profiles: [monitoring]
    image: prom/prometheus:latest
    container_name: qwq-prometheus
    restart: unless-stopped
    ports:
      - "127.0.0.1:9091:9090"
    volumes:
      - ./config/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    networks:
      - qwq-network

  # Grafana 可视化（可选）
  grafana:
    profiles: [monitoring]
    image: grafana/grafana:latest
    container_name: qwq-grafana
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-}
      - GF_INSTALL_PLUGINS=grafana-clock-panel
    volumes:
      - grafana-data:/var/lib/grafana
    networks:
      - qwq-network

networks:
  qwq-network:
    driver: bridge

volumes:
  mysql-data:
  redis-data:
  prometheus-data:
  grafana-data:
