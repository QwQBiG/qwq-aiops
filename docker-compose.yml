services:
  qwq:
    # 本地构建（推荐）
    build: .
    image: qwq-aiops:latest
    # 或者使用 GitHub Container Registry 镜像（需要先发布）
    # image: ghcr.io/qwqbig/qwq-aiops:latest
    container_name: qwq
    restart: unless-stopped
    ports:
      - "127.0.0.1:8081:8080"
    volumes:
      # Docker socket（用于容器管理）
      # Access depends on the host socket permissions, even with a read-only mount.
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # Persist rotating service logs.
      - ./logs:/app/logs
    environment:
      # 基础配置
      - TZ=Asia/Shanghai
      - PORT=8080
      # Model endpoint configuration is loaded from .env by Compose.
      - AI_PROVIDER=${AI_PROVIDER:-openai}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-https://api.openai.com/v1}
      - OPENAI_MODEL=${OPENAI_MODEL:-}
      - OLLAMA_HOST=${OLLAMA_HOST:-http://host.docker.internal:11434}
      - OLLAMA_MODEL=${OLLAMA_MODEL:-}
      
      # Recreate the service with docker compose up -d qwq after changing .env.
      
      # 通知配置（从 .env 文件读取）
      - DINGTALK_WEBHOOK=${DINGTALK_WEBHOOK:-}
      - TELEGRAM_TOKEN=${TELEGRAM_TOKEN:-}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID:-}
      
      # Web 认证配置
      - WEB_USER=${WEB_USER:?Set WEB_USER in .env}
      - WEB_PASSWORD=${WEB_PASSWORD:?Set WEB_PASSWORD in .env}
    networks:
      - qwq-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    # 资源限制
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M

networks:
  qwq-network:
    driver: bridge
