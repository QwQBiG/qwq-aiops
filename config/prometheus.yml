global:
  scrape_interval: 15s
  evaluation_interval: 15s

# The web entrypoint does not expose Prometheus metrics. Database servers also
# require dedicated exporters; their native ports cannot be scraped as HTTP.
# Add explicit exporter targets here after deploying and configuring them.
scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: [localhost:9090]
