name: Build and Test

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version-file: go.mod

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: npm
        cache-dependency-path: frontend/package-lock.json

    - name: Download dependencies
      run: go mod download

    - name: Build embedded frontend
      run: node scripts/build.mjs --frontend-only

    - name: Test frontend behavior
      run: npm test --prefix frontend

    - name: Audit frontend dependencies
      run: npm audit --prefix frontend --audit-level=high

    - name: Save embedded frontend
      uses: actions/upload-artifact@v4
      with:
        name: embedded-frontend
        path: internal/server/dist/
        if-no-files-found: error

    - name: Run tests
      run: go test -race -coverprofile=coverage.txt -covermode=atomic ./...

    - name: Check reachable Go vulnerabilities
      run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./cmd/... ./internal/...

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v4
      with:
        files: ./coverage.txt
        flags: unittests
        name: codecov-umbrella

  build:
    name: Build Binaries
    runs-on: ubuntu-latest
    needs: test
    strategy:
      matrix:
        goos: [linux, windows, darwin]
        goarch: [amd64, arm64]
        exclude:
          - goos: windows
            goarch: arm64
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version-file: go.mod

    - name: Restore embedded frontend
      uses: actions/download-artifact@v4
      with:
        name: embedded-frontend
        path: internal/server/dist/

    - name: Build
      env:
        GOOS: ${{ matrix.goos }}
        GOARCH: ${{ matrix.goarch }}
        CGO_ENABLED: '0'
      run: |
        OUTPUT_NAME=qwq-${{ matrix.goos }}-${{ matrix.goarch }}
        if [ "${{ matrix.goos }}" = "windows" ]; then
          OUTPUT_NAME="${OUTPUT_NAME}.exe"
        fi
        go build -trimpath -ldflags="-w -s" -o "${OUTPUT_NAME}" ./cmd/qwq

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: qwq-${{ matrix.goos }}-${{ matrix.goarch }}
        path: qwq-*
