name: Docker Build and Publish

on:
  push:
    branches:
      - main
      - develop
    tags:
      - 'v*.*.*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  smoke:
    name: Test Container Runtime
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Validate Compose configuration
        env:
          WEB_USER: smoke-user
          WEB_PASSWORD: smoke-password
        run: |
          docker compose config --quiet
          if WEB_PASSWORD= docker compose config --quiet; then
            echo 'Compose accepted missing credentials'
            exit 1
          fi

      - name: Build runtime test image
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: qwq-smoke:local
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify startup, authentication, assets, and shutdown
        shell: bash
        run: |
          set -euo pipefail
          trap 'docker logs qwq-smoke; docker rm -f qwq-smoke >/dev/null' EXIT
          docker run --detach --name qwq-smoke --publish 127.0.0.1::8080 \
            --env OPENAI_API_KEY=smoke --env OPENAI_BASE_URL=http://127.0.0.1:9/v1 \
            --env OPENAI_MODEL=smoke --env WEB_USER=smoke-user \
            --env WEB_PASSWORD=smoke-password qwq-smoke:local
          address="http://$(docker port qwq-smoke 8080/tcp)"
          ready=false
          for attempt in {1..30}; do
            if curl --silent --fail "$address/health"; then
              ready=true
              break
            fi
            sleep 1
          done
          test "$ready" = true
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' "$address/api/health")" = 401
          curl --silent --fail --user smoke-user:smoke-password "$address/api/health" >/dev/null
          curl --silent --fail --user smoke-user:smoke-password "$address/" > /tmp/qwq-index.html
          asset=$(sed -n 's/.*src="\([^"]*\/assets\/[^\"]*\.js\)".*/\1/p' /tmp/qwq-index.html | head -1)
          test -n "$asset"
          curl --silent --fail --user smoke-user:smoke-password "$address$asset" >/dev/null
          docker exec qwq-smoke sh -c 'test "$(id -u)" -ne 0 && test -s /app/logs/qwq.log'
          docker stop --time 15 qwq-smoke
          test "$(docker inspect --format '{{.State.ExitCode}}' qwq-smoke)" = 0

  build-and-push:
    needs: smoke
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        id: push
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            INSTALL_KUBECTL=true

      - name: Generate artifact attestation
        if: github.event_name != 'pull_request'
        uses: actions/attest-build-provenance@v1
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
